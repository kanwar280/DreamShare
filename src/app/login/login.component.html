
<div class="main">
<div class="login-options" *ngIf="!user">
    <h2 >Login with Google</h2>
    <button class="button" *ngIf="!user" (click)="loginWithGoogle()"><svg class="icon" viewBox="0 0 24 24">
        <path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"></path>
        <path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"></path>
        <path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" fill="#FBBC05"></path>
        <path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"></path>
        <path d="M1 1h22v22H1z" filsl="none"></path>
        </svg>Sign in with Google</button>
  
    <button class="button side" (click)="goback()">Back</button>
</div>

<div class="login-options" *ngIf="user">
      <p>Welcome, {{ user.displayName }}</p>
      <button class="button" (click) = goback()>back</button>

      <button class="button side" (click)="logout()">LogOut</button>
      <div class="wrapper">
        <div class="option">            
          <input class="input" type="radio" name="btn" value="mydreams" checked [(ngModel)]="selectedOption" (change)="onOptionChange($event)">
          <div class="btn">
            <span class="span">My Dreams</span>
          </div>
        </div>
        <div class="option">
          <input class="input" type="radio" name="btn" value="saveddreams" [(ngModel)]="selectedOption" (change)="onOptionChange($event)">
          <div class="btn">
            <span class="span">Saved Dreams</span>
          </div>  </div>
      </div>
      <article *ngFor="let window of selectedwindows; let i = index" class="articles fade"
  [ngStyle]="getCombinedStyles(window, randomPositions[i+windowIndex])"
 appDraggable [ngClass]="fadeState" >
 <div class="button-top-right" *ngIf="window.Image" (click)="toggleView(window)" (touchstart)="toggleView(window)">
  ?
</div>
    <div class="article-container"[ngClass]="{'hidden' : window.hideContent }" [ngStyle]="{
      'background-color': window.Image ? 'rgba(255, 255, 255, 0.8)' : 'white'
    }">
      <aside> [{{window.Title}}] </aside>
      "{{window.Dream}}"
      <aside> [{{window.Date}}  -  {{window.Type}}]</aside>
    </div>
    <div class="button-container">
      <button id="save" (click)="saveDream(window)"><svg width="20px" height="20px" viewBox="0 0 24 24" [attr.fill]="window.svgFillColor || 'black'"xmlns="http://www.w3.org/2000/svg">
        <path fill-rule="evenodd" clip-rule="evenodd" d="M6.75 6L7.5 5.25H16.5L17.25 6V19.3162L12 16.2051L6.75 19.3162V6ZM8.25 6.75V16.6838L12 14.4615L15.75 16.6838V6.75H8.25Z"/>
      </svg></button>

    </div>

</div>

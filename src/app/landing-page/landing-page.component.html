
<div class="main">
  
  <h1 class="heading">Dreams.archive</h1>
  <!--login tag starts-->
  <div class="next-button">
    <button class="button" role="button" (click) = Next()>next</button>
  </div>
  
  <div class="button-container-top">
    <button class="button" role="button" (click) = gotopost()>post</button>
    <button class="button" role="button" (click) = gotologin()>{{user?.displayName ??  'Log In'}}</button>
    
  </div>
  

  <!--login tag ends-->
  <article *ngFor="let window of displayedwindows; let i = index" class="articles fade"
  [ngStyle]="getCombinedStyles(window, randomPositions[i+windowIndex], randomTransformations[i+windowIndex])"
 appDraggable (dismiss)="removeArticle(window)" [ngClass]="fadeState" >
 <div class="button-top-right" *ngIf="window.Image" (click)="toggleView(window)" (touchstart)="toggleView(window)">
  ?
</div>
    <div class="article-container"[ngClass]="{'hidden' : window.hideContent }" [ngStyle]="{
      'background-color': window.Image ? 'rgba(255, 255, 255, 0.8)' : 'white'
    }">
      <aside> [{{window.Title}}] </aside>
      "{{window.Dream}}"
      <aside> [{{window.Date}}  -  {{window.Type}}]</aside>
    </div>
    <div class="button-container">
      <button id="save" (click)="saveDream(window)"><svg width="20px" height="20px" viewBox="0 0 24 24" [attr.fill]="window.svgFillColor || 'black'"xmlns="http://www.w3.org/2000/svg">
        <path fill-rule="evenodd" clip-rule="evenodd" d="M6.75 6L7.5 5.25H16.5L17.25 6V19.3162L12 16.2051L6.75 19.3162V6ZM8.25 6.75V16.6838L12 14.4615L15.75 16.6838V6.75H8.25Z"/>
      </svg></button>
     
      <button id="share" (click)="openPopup(window)"><svg xmlns="http://www.w3.org/2000/svg" x="0px" y="0px" width="15px" height="15px" viewBox="0 0 24 24">
        <path d="M 15.990234 1.9902344 A 1.0001 1.0001 0 0 0 15.292969 3.7070312 L 17.585938 6 L 17 6 C 10.936593 6 6 10.936593 6 17 A 1.0001 1.0001 0 1 0 8 17 C 8 12.017407 12.017407 8 17 8 L 17.585938 8 L 15.292969 10.292969 A 1.0001 1.0001 0 1 0 16.707031 11.707031 L 20.707031 7.7070312 A 1.0001 1.0001 0 0 0 20.707031 6.2929688 L 16.707031 2.2929688 A 1.0001 1.0001 0 0 0 15.990234 1.9902344 z M 2.984375 7.9863281 A 1.0001 1.0001 0 0 0 2 9 L 2 19 C 2 20.64497 3.3550302 22 5 22 L 19 22 C 20.64497 22 22 20.64497 22 19 L 22 18 A 1.0001 1.0001 0 1 0 20 18 L 20 19 C 20 19.56503 19.56503 20 19 20 L 5 20 C 4.4349698 20 4 19.56503 4 19 L 4 9 A 1.0001 1.0001 0 0 0 2.984375 7.9863281 z"></path>
        </svg>
      </button>
    </div>
    <!--expandable div-->
  </article>

<app-popup 
*ngIf="selectedWindow" 
[data]="selectedWindow" 
[onClose]="closePopup.bind(this)">
</app-popup>
</div>

<div class="stacks-container">

</div>
